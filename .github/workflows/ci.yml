name: WorldAct checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: worldact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: worldact
          POSTGRES_PASSWORD: worldact-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worldact -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://worldact:worldact-ci@127.0.0.1:5432/postgres
      WORLDACT_MAIL_MODE: outbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:isolated
      - name: Compiled Node server regression
        env:
          ISOLATED_TEST_COMPILED: "true"
        run: >-
          node scripts/test-isolated.mjs
          tests/fonts.test.ts tests/font-worker-lifecycle.test.ts tests/site-identity.test.ts tests/bundled-plugins-api.test.ts
          tests/connectors.test.ts
          tests/connector-ui.test.ts
          tests/mail-intake.test.ts tests/mail-message.test.ts tests/pop3.test.ts
          tests/comment-capabilities.test.ts tests/template-access.test.ts tests/server-startup.test.ts
          tests/comment-types.test.ts
          tests/comment-duplicates.test.ts
          tests/comment-approval-history.test.ts tests/comment-approval-actors.test.ts tests/comment-approval-waits.test.ts
          tests/compat.test.ts tests/theme-blocks.test.ts
          tests/notification-mail-ui.test.ts
          tests/comment-avatar-context.test.ts
          tests/comment-window.test.ts
          tests/widget-blocks.test.ts tests/widget-layout.test.ts tests/date-archives.test.ts
          tests/footnotes.test.ts tests/term-blocks.test.ts tests/loginout.test.ts tests/auth-reset.test.ts
          tests/interactive-blocks.test.ts tests/background-styles.test.ts tests/template-areas.test.ts
          tests/navigation-overlays.test.ts tests/password-listings.test.ts tests/legacy-content.test.ts
          tests/math-blocks.test.ts tests/icons.test.ts tests/protected-metadata.test.ts
          tests/category-permalinks.test.ts
          tests/page-delete-reparent.test.ts tests/post-mutation-locks.test.ts
          tests/plain-permalinks.test.ts
          tests/plain-permalink-routing.test.ts tests/plain-source-pagination.test.ts
          tests/front-page-availability.test.ts
          tests/public-http-status.test.ts
          tests/rss.test.ts tests/playlist-blocks.test.ts tests/audio-metadata.test.ts
          tests/outgoing-ping-protocol.test.ts tests/outgoing-pings.test.ts
          tests/incoming-pings.test.ts
          tests/block-render-attributes.test.ts
          tests/block-bindings.test.ts tests/m4a-mime.test.ts
          tests/audio-artwork.test.ts
          tests/media-file-references.test.ts
          tests/wxr-media.test.ts
          tests/wxr-export.test.ts
          tests/profile-email.test.ts tests/media-zero-dimensions.test.ts
          tests/profile-options.test.ts
          tests/editor-preferences.test.ts
          tests/editor-options-ui.test.ts
          tests/media-format-preservation.test.ts
          tests/full-image-uploads.test.ts tests/media-upload-cleanup.test.ts
          tests/media-edit-transforms.test.ts tests/media-edit-copy.test.ts
          tests/media-native-rest.test.ts tests/rest-fields.test.ts
          tests/media-captions.test.ts
          tests/native-media-owner.test.ts
          tests/native-media-code-rebase.test.ts
          tests/native-caption-initialization.test.ts
          tests/classic-editor.test.ts tests/classic-persistence.test.ts
          tests/classic-initial-caption.test.ts
          tests/classic-parser.test.ts tests/block-history.test.ts
          tests/account-tools-ui.test.ts
          tests/legacy-routes.test.ts tests/login-remember.test.ts tests/media-details-state.test.ts
          tests/dashboard.test.ts tests/dashboard-dates.test.ts
          tests/post-list-dates.test.ts
          tests/post-list-date-format.test.ts tests/classic-comment-tree.test.ts
          tests/fresh-defaults.test.ts tests/admin-tools.test.ts
          tests/shortcodes.test.ts
      - name: Fresh browser installation on the compiled server
        env:
          ISOLATED_TEST_UNSEEDED: "true"
          ISOLATED_TEST_COMPILED: "true"
        run: node scripts/test-isolated.mjs tests/install.test.ts
      - name: Export site archive
        if: matrix.node == 24
        env:
          SITE_ARCHIVE_STAGE: export
          SITE_ARCHIVE_PATH: ${{ runner.temp }}/worldact-site.json
        run: node scripts/test-isolated.mjs tests/portability-site.test.ts
      - name: Restore site archive to a fresh database
        if: matrix.node == 24
        env:
          SITE_ARCHIVE_STAGE: restore
          SITE_ARCHIVE_PATH: ${{ runner.temp }}/worldact-site.json
        run: node scripts/test-isolated.mjs tests/portability-site.test.ts
      - name: Export Plain permalink archive
        if: matrix.node == 24
        env:
          SITE_ARCHIVE_STAGE: export
          SITE_ARCHIVE_LINK_MODE: plain
          SITE_ARCHIVE_PATH: ${{ runner.temp }}/worldact-plain-site.json
        run: node scripts/test-isolated.mjs tests/portability-site.test.ts
      - name: Restore Plain archive on a fresh compiled server
        if: matrix.node == 24
        env:
          ISOLATED_TEST_COMPILED: "true"
          SITE_ARCHIVE_STAGE: restore
          SITE_ARCHIVE_LINK_MODE: plain
          SITE_ARCHIVE_PATH: ${{ runner.temp }}/worldact-plain-site.json
        run: node scripts/test-isolated.mjs tests/portability-site.test.ts
      - name: Export image format archive
        if: matrix.node == 24
        env:
          IMAGE_FORMAT_ARCHIVE_STAGE: export
          IMAGE_FORMAT_ARCHIVE_PATH: ${{ runner.temp }}/worldact-images.json
        run: node scripts/test-isolated.mjs tests/media-format-preservation.test.ts
      - name: Restore image format archive to a fresh database
        if: matrix.node == 24
        env:
          IMAGE_FORMAT_ARCHIVE_STAGE: restore
          IMAGE_FORMAT_ARCHIVE_PATH: ${{ runner.temp }}/worldact-images.json
        run: node scripts/test-isolated.mjs tests/media-format-preservation.test.ts
      - name: Export normalized full-image archive
        if: matrix.node == 24
        env:
          FULL_IMAGE_ARCHIVE_STAGE: export
          FULL_IMAGE_ARCHIVE_PATH: ${{ runner.temp }}/worldact-full-images.json
        run: node scripts/test-isolated.mjs tests/full-image-uploads.test.ts
      - name: Restore normalized full-image archive on a fresh compiled server
        if: matrix.node == 24
        env:
          ISOLATED_TEST_COMPILED: "true"
          FULL_IMAGE_ARCHIVE_STAGE: restore
          FULL_IMAGE_ARCHIVE_PATH: ${{ runner.temp }}/worldact-full-images.json
        run: node scripts/test-isolated.mjs tests/full-image-uploads.test.ts
      - name: Export rich and literal media captions
        if: matrix.node == 24
        env:
          CAPTION_ARCHIVE_STAGE: export
          CAPTION_ARCHIVE_PATH: ${{ runner.temp }}/worldact-captions.json
        run: node scripts/test-isolated.mjs tests/media-captions.test.ts
      - name: Restore media captions on a fresh compiled server
        if: matrix.node == 24
        env:
          ISOLATED_TEST_COMPILED: "true"
          CAPTION_ARCHIVE_STAGE: restore
          CAPTION_ARCHIVE_PATH: ${{ runner.temp }}/worldact-captions.json
        run: node scripts/test-isolated.mjs tests/media-captions.test.ts
      - name: Export font archive
        if: matrix.node == 24
        env:
          FONT_ARCHIVE_STAGE: export
          FONT_ARCHIVE_PATH: ${{ runner.temp }}/worldact-fonts.json
        run: node scripts/test-isolated.mjs tests/portability-fonts.test.ts
      - name: Restore font archive to a fresh database
        if: matrix.node == 24
        env:
          FONT_ARCHIVE_STAGE: restore
          FONT_ARCHIVE_PATH: ${{ runner.temp }}/worldact-fonts.json
        run: node scripts/test-isolated.mjs tests/portability-fonts.test.ts
